<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Learn & Play — Grade 1</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#7ec8e3">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Learn & Play">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Baloo+2:wght@500;600;700&display=swap');
  :root{
    --sky:#7ec8e3;--grass:#8ed081;--sun:#ffd23f;--coral:#ff8c69;--grape:#a882dd;
    --cream:#fff8ec;--ink:#3a3042;--shadow:rgba(58,48,66,.18);--ok:#5fbf6a;--no:#ff6b6b;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html{height:100%}
  body{
    min-height:100%;
    font-family:'Fredoka',sans-serif;
    background:linear-gradient(160deg,#bfeaf5 0%,#d9f2d3 100%);
    background-attachment:fixed;
    color:var(--ink);user-select:none;touch-action:manipulation;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;flex:0 0 auto;gap:10px}
  .home-btn,.snd-btn{
    background:var(--cream);border:none;border-radius:20px;padding:10px 18px;
    font-family:'Baloo 2';font-size:20px;font-weight:700;color:var(--ink);
    box-shadow:0 4px 0 var(--shadow);cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .home-btn:active,.snd-btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--shadow)}
  .home-btn.hidden{visibility:hidden}
  .bar-right{display:flex;gap:10px;align-items:center}
  .progress{background:var(--cream);border-radius:20px;padding:10px 18px;font-family:'Baloo 2';font-size:20px;font-weight:700;box-shadow:0 4px 0 var(--shadow)}
  .progress.hidden{display:none}
  .stars{background:var(--cream);border-radius:20px;padding:10px 20px;font-family:'Baloo 2';font-size:22px;font-weight:700;box-shadow:0 4px 0 var(--shadow);display:flex;align-items:center;gap:6px}

  .stage{flex:1 1 auto;display:flex;align-items:flex-start;justify-content:center;padding:0 20px 24px;overflow-y:auto;-webkit-overflow-scrolling:touch}
  .screen{width:100%;max-width:1100px;margin:auto;display:none;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
  .screen.active{display:flex}

  .title{font-family:'Baloo 2';font-size:clamp(38px,7vw,72px);font-weight:700;color:#fff;text-shadow:0 5px 0 var(--coral),0 8px 14px var(--shadow);margin-bottom:4px;text-align:center}
  .subtitle{font-size:clamp(18px,3vw,26px);color:var(--ink);opacity:.75;margin-bottom:24px}
  .menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}
  .tile{border:none;border-radius:28px;padding:24px 16px;cursor:pointer;font-family:'Baloo 2';font-weight:700;color:#fff;box-shadow:0 7px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .08s}
  .tile:active{transform:translateY(4px);box-shadow:0 3px 0 var(--shadow)}
  .tile .emoji{font-size:clamp(34px,6vw,54px);line-height:1}
  .tile .label{font-size:clamp(18px,2.6vw,25px)}
  .tile .sub{font-size:14px;font-weight:500;opacity:.9}
  .t1{background:var(--coral)}.t2{background:var(--grape)}.t3{background:var(--grass)}
  .t4{background:#f4a259}.t5{background:#4cc9c0}.t6{background:#e07a9b}
  .t7{background:#6c8ee3}.t8{background:#5cb85c}

  /* length picker */
  .panel{background:var(--cream);border-radius:32px;padding:34px 30px;box-shadow:0 10px 0 var(--shadow);text-align:center;max-width:620px;width:100%}
  .panel h2{font-family:'Baloo 2';font-size:clamp(26px,4vw,38px);margin-bottom:6px}
  .panel p{opacity:.65;font-size:18px;margin-bottom:26px}
  .len-row{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .len-btn{border:none;border-radius:24px;padding:26px 30px;cursor:pointer;font-family:'Baloo 2';font-weight:700;color:#fff;background:var(--grape);box-shadow:0 6px 0 var(--shadow);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:130px;transition:transform .08s}
  .len-btn:nth-child(2){background:var(--coral)}.len-btn:nth-child(3){background:var(--grass)}
  .len-btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
  .len-btn .n{font-size:44px;line-height:1}
  .len-btn .t{font-size:17px;font-weight:500}

  .qhead{font-family:'Baloo 2';font-size:clamp(22px,3.6vw,34px);font-weight:600;margin-bottom:16px;text-align:center}
  .qhead .en{display:block;font-size:.62em;font-weight:500;opacity:.6;margin-top:2px}
  .prompt-card{background:var(--cream);border-radius:32px;padding:26px 36px;box-shadow:0 10px 0 var(--shadow);margin-bottom:22px;display:flex;align-items:center;justify-content:center;gap:20px;flex-wrap:wrap;min-height:130px;width:100%}
  .bignum{font-family:'Baloo 2';font-size:clamp(50px,10vw,92px);font-weight:700;color:var(--grape)}
  .op{font-family:'Baloo 2';font-size:clamp(42px,8vw,76px);font-weight:700;color:var(--coral)}
  .emoji-group{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;align-items:center;max-width:320px}
  .emoji-group span{font-size:clamp(28px,5vw,42px);line-height:1}

  .compare-wrap{display:flex;gap:20px;width:100%;justify-content:center;flex-wrap:wrap}
  .compare-box{background:var(--cream);border-radius:28px;padding:20px;cursor:pointer;box-shadow:0 8px 0 var(--shadow);flex:1;min-width:170px;max-width:290px;display:flex;flex-direction:column;align-items:center;gap:10px;border:6px solid transparent;transition:transform .08s}
  .compare-box:active{transform:translateY(3px)}
  .compare-box.pick-ok{border-color:var(--ok);animation:pop .3s}
  .compare-box.pick-no{border-color:var(--no);animation:shake .3s}
  .compare-box .cnt{font-family:'Baloo 2';font-size:clamp(28px,5vw,42px);font-weight:700;color:var(--grape)}

  .options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:100%;max-width:620px}
  .options.three{grid-template-columns:repeat(3,1fr);max-width:740px}
  .opt{border:none;border-radius:24px;padding:20px 10px;cursor:pointer;font-family:'Baloo 2';font-size:clamp(26px,4.5vw,42px);font-weight:700;color:#fff;background:var(--sky);box-shadow:0 6px 0 var(--shadow);transition:transform .08s}
  .opt:nth-child(2){background:var(--grape)}.opt:nth-child(3){background:var(--coral)}.opt:nth-child(4){background:var(--grass)}
  .opt:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
  .opt.ok{background:var(--ok)!important;animation:pop .3s}
  .opt.no{background:var(--no)!important;animation:shake .3s}
  .opt.sel{outline:6px solid var(--grape);outline-offset:-3px;transform:translateY(2px)}
  .check-btn{margin-top:20px;border:none;border-radius:24px;padding:18px 44px;cursor:pointer;font-family:'Baloo 2';font-size:26px;font-weight:700;color:#fff;background:var(--grape);box-shadow:0 6px 0 var(--shadow);transition:transform .08s}
  .check-btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
  .check-btn:disabled{opacity:.45;box-shadow:0 6px 0 var(--shadow)}

  /* score screen */
  .score-card{background:var(--cream);border-radius:36px;padding:40px 36px;box-shadow:0 12px 0 var(--shadow);text-align:center;max-width:560px;width:100%}
  .score-face{font-size:clamp(80px,16vw,130px);animation:pop .5s}
  .score-title{font-family:'Baloo 2';font-size:clamp(30px,5vw,46px);font-weight:700;margin:6px 0}
  .menu-grid.subjects{grid-template-columns:repeat(2,1fr);max-width:720px}
  .menu-grid.subjects .tile{padding:40px 20px}
  .menu-grid.subjects .emoji{font-size:clamp(50px,9vw,80px)}
  .menu-grid.subjects .label{font-size:clamp(24px,3.6vw,34px)}
  /* kartu karakter (bahasa inggris) */
  .char-card{background:var(--cream);border-radius:32px;padding:20px 30px;box-shadow:0 10px 0 var(--shadow);margin-bottom:18px;display:flex;align-items:center;gap:22px;width:100%;max-width:640px}
  .char-card .avatar{font-size:clamp(60px,11vw,96px);line-height:1}
  .char-card .info{display:flex;flex-direction:column;gap:4px;font-size:clamp(18px,2.8vw,24px)}
  .char-card .info b{font-family:'Baloo 2';font-size:1.25em;color:var(--grape)}
  .char-card .info .row{display:flex;gap:8px;align-items:center}
  .char-card .info .k{opacity:.55;font-size:.85em;min-width:64px}
  .q-sentence{background:var(--cream);border-radius:28px;padding:20px 30px;box-shadow:0 8px 0 var(--shadow);margin-bottom:18px;font-family:'Baloo 2';font-size:clamp(26px,4.6vw,40px);font-weight:700;color:var(--ink);text-align:center;width:100%;max-width:760px}
  .q-sentence .blank{display:inline-block;min-width:1.6em;border-bottom:5px solid var(--coral);color:var(--coral);margin:0 4px}
  .options.sent{grid-template-columns:1fr 1fr;max-width:800px}
  .opt.sent{font-size:clamp(19px,3vw,28px);padding:18px 14px;line-height:1.25}
  .opt.word{font-size:clamp(28px,5vw,44px)}
  @media (max-width:640px){.options.sent{grid-template-columns:1fr}}
  .score-num{font-family:'Baloo 2';font-size:clamp(60px,14vw,104px);font-weight:700;color:var(--grape);line-height:1;margin:8px 0 2px}
  .score-sub{font-size:18px;opacity:.6;margin-bottom:14px;letter-spacing:.5px}
  .score-tally{display:flex;gap:16px;justify-content:center;margin:6px 0 4px}
  .tally{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:22px;padding:14px 26px;box-shadow:0 5px 0 var(--shadow);min-width:104px}
  .tally .ic{font-size:26px;line-height:1}
  .tally .tv{font-family:'Baloo 2';font-size:clamp(30px,6vw,42px);font-weight:700;line-height:1.1}
  .tally .tl{font-size:15px;opacity:.7;font-weight:500}
  .tally.ok .tv{color:var(--ok)}
  .tally.no .tv{color:var(--no)}
  .score-stars{font-size:clamp(34px,7vw,54px);margin:14px 0 24px;letter-spacing:6px}
  .score-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
  .btn{border:none;border-radius:24px;padding:18px 30px;cursor:pointer;font-family:'Baloo 2';font-size:22px;font-weight:700;color:#fff;box-shadow:0 6px 0 var(--shadow);transition:transform .08s}
  .btn:active{transform:translateY(3px);box-shadow:0 3px 0 var(--shadow)}
  .btn.again{background:var(--coral)}.btn.menu{background:var(--sky)}

  .feedback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;pointer-events:none;z-index:50}
  .feedback.show{display:flex}
  .feedback .face{font-size:clamp(80px,18vw,150px);animation:pop .4s}
  .feedback .word{font-family:'Baloo 2';font-size:clamp(32px,6vw,56px);font-weight:700;color:#fff;text-shadow:0 4px 0 var(--shadow)}

  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  .confetti{position:fixed;top:-20px;width:12px;height:12px;z-index:40;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <button class="home-btn hidden" id="homeBtn">🏠</button>
    <div class="bar-right">
      <div class="progress hidden" id="progress">1/10</div>
      <button class="snd-btn" id="sndBtn">🔊</button>
      <div class="stars">⭐ <span id="starCount">0</span></div>
    </div>
  </div>

  <div class="stage">
    <!-- HOME: pilih pelajaran -->
    <section class="screen active" id="home">
      <h1 class="title">Learn &amp; Play 🎈</h1>
      <p class="subtitle">Choose a subject</p>
      <div class="menu-grid subjects">
        <button class="tile subj t2" data-subject="math"><span class="emoji">🔢</span><span class="label">Math</span><span class="sub">Numbers &amp; counting</span></button>
        <button class="tile subj t1" data-subject="eng"><span class="emoji">🗣️</span><span class="label">English</span><span class="sub">He / She · His / Her</span></button>
      </div>
    </section>

    <!-- MENU MATEMATIKA -->
    <section class="screen" id="mathMenu">
      <h1 class="title">Math Fun 🔢</h1>
      <p class="subtitle">Grade 1 math practice</p>
      <div class="menu-grid">
        <button class="tile t1" data-mode="add"><span class="emoji">➕</span><span class="label">Addition</span><span class="sub">Plus +</span></button>
        <button class="tile t2" data-mode="sub"><span class="emoji">➖</span><span class="label">Subtraction</span><span class="sub">Minus −</span></button>
        <button class="tile t3" data-mode="ls"><span class="emoji">⚖️</span><span class="label">Larger / Smaller</span><span class="sub">Compare two numbers</span></button>
        <button class="tile t4" data-mode="fm"><span class="emoji">🍎</span><span class="label">Fewer / More</span><span class="sub">Compare two groups</span></button>
        <button class="tile t5" data-mode="est"><span class="emoji">🏆</span><span class="label">Largest / Smallest</span><span class="sub">Find the extreme</span></button>
        <button class="tile t6" data-mode="btw"><span class="emoji">🔢</span><span class="label">Between</span><span class="sub">Numbers in between</span></button>
        <button class="tile t7" data-mode="mul"><span class="emoji">✖️</span><span class="label">Multiplication</span><span class="sub">Times ×</span></button>
        <button class="tile t8" data-mode="div"><span class="emoji">➗</span><span class="label">Division</span><span class="sub">Divide ÷</span></button>
      </div>
    </section>

    <!-- MENU BAHASA INGGRIS -->
    <section class="screen" id="engMenu">
      <h1 class="title">English Fun 🗣️</h1>
      <p class="subtitle">He / She · His / Her — Grade 1</p>
      <div class="menu-grid">
        <button class="tile t3" data-mode="en_name"><span class="emoji">🏷️</span><span class="label">Name</span><span class="sub">What is his / her name?</span></button>
        <button class="tile t4" data-mode="en_age"><span class="emoji">🎂</span><span class="label">Age</span><span class="sub">How old is he / she?</span></button>
        <button class="tile t5" data-mode="en_toy"><span class="emoji">🧸</span><span class="label">Favorite Toy</span><span class="sub">What is his / her favorite toy?</span></button>
        <button class="tile t7" data-mode="en_pron"><span class="emoji">✏️</span><span class="label">He / She · His / Her</span><span class="sub">Fill in the blank</span></button>
        <button class="tile t6" data-mode="en_ask"><span class="emoji">❓</span><span class="label">Match the Question</span><span class="sub">Which question fits?</span></button>
        <button class="tile t8" data-mode="en_mix"><span class="emoji">🎲</span><span class="label">Mixed</span><span class="sub">All types together</span></button>
      </div>
    </section>

    <!-- LENGTH PICKER -->
    <section class="screen" id="lenPick">
      <div class="panel">
        <h2 id="lenTitle">How many questions?</h2>
        <p>Pick a session length</p>
        <div class="len-row">
          <button class="len-btn" data-len="5"><span class="n">5</span><span class="t">questions · quick</span></button>
          <button class="len-btn" data-len="10"><span class="n">10</span><span class="t">questions · standard</span></button>
          <button class="len-btn" data-len="15"><span class="n">15</span><span class="t">questions · challenge</span></button>
        </div>
      </div>
    </section>

    <!-- PLAY -->
    <section class="screen" id="play">
      <div class="qhead" id="qhead"></div>
      <div id="qbody" style="width:100%;display:flex;flex-direction:column;align-items:center"></div>
    </section>

    <!-- SCORE -->
    <section class="screen" id="scoreScreen">
      <div class="score-card">
        <div class="score-face" id="scoreFace">🎉</div>
        <div class="score-title" id="scoreTitle">Great job!</div>
        <div class="score-num"><span id="scoreNum">100</span></div>
        <div class="score-sub">Your score</div>
        <div class="score-tally">
          <div class="tally ok"><span class="ic">✅</span><span class="tv" id="tallyRight">0</span><span class="tl">Correct</span></div>
          <div class="tally no"><span class="ic">❌</span><span class="tv" id="tallyWrong">0</span><span class="tl">Wrong</span></div>
        </div>
        <div class="score-stars" id="scoreStars">⭐⭐⭐</div>
        <div class="score-actions">
          <button class="btn again" id="againBtn">🔁 Play again</button>
          <button class="btn menu" id="menuBtn">🏠 Menu</button>
        </div>
      </div>
    </section>
  </div>
</div>

<div class="feedback" id="feedback">
  <div class="face" id="fbFace">🎉</div>
  <div class="word" id="fbWord">Great!</div>
</div>

<script>
/* ============ SOUND (Web Audio, no external files) ============ */
const Sound=(()=>{
  let ctx,masterOn=true,musicTimer,musicNode;
  function ac(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();return ctx}
  function resume(){if(ctx&&ctx.state==='suspended')ctx.resume()}
  function tone(freq,dur,type='sine',vol=.2,when=0){
    const c=ac();const t=c.currentTime+when;
    const o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.value=freq;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(g).connect(c.destination);o.start(t);o.stop(t+dur+.02);
  }
  function correct(){if(!masterOn)return;[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',.22,i*.09))}
  function wrong(){if(!masterOn)return;tone(300,.18,'sawtooth',.16);tone(200,.25,'sawtooth',.16,.12)}
  function tap(){if(!masterOn)return;tone(660,.06,'square',.08)}
  function fanfare(){if(!masterOn)return;[523,659,784,1047,1319].forEach((f,i)=>tone(f,.3,'triangle',.22,i*.12))}
  // cheerful looping background melody
  const melody=[523,587,659,523,659,784,659,587,523,587,659,587,523,494,523,0];
  let step=0;
  function startMusic(){
    stopMusic();
    const beat=.38;
    function loop(){
      if(!masterOn)return;
      const f=melody[step%melody.length];
      if(f>0)tone(f,.3,'triangle',.06);
      // soft bass every 4
      if(step%4===0)tone(f>0?f/2:262,.35,'sine',.05);
      step++;
    }
    musicTimer=setInterval(loop,beat*1000);
  }
  function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
  function toggle(){
    masterOn=!masterOn;
    if(masterOn){resume();startMusic()}else{stopMusic()}
    return masterOn;
  }
  function isOn(){return masterOn}
  return {resume,correct,wrong,tap,fanfare,startMusic,stopMusic,toggle,isOn};
})();

/* ============ STATE ============ */
const app={stars:0,subject:null,mode:null,total:10,idx:0,score:0,wrong:0};
const $=id=>document.getElementById(id);
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
const EMO=['🍎','🍌','⭐','🐶','🐱','🎈','🍩','🐟','🌸','🚗','🦋','🍓'];

/* ============ NAV ============ */
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
document.querySelectorAll('.tile.subj').forEach(t=>t.onclick=()=>{Sound.resume();Sound.tap();app.subject=t.dataset.subject;openSubject()});
document.querySelectorAll('.tile:not(.subj)').forEach(t=>t.onclick=()=>{Sound.resume();Sound.tap();app.mode=t.dataset.mode;openLenPick()});
document.querySelectorAll('.len-btn').forEach(b=>b.onclick=()=>{Sound.tap();app.total=+b.dataset.len;startSession()});
$('homeBtn').onclick=()=>{Sound.tap();goHome()};
$('againBtn').onclick=()=>{Sound.tap();startSession()};
$('menuBtn').onclick=()=>{Sound.tap();openSubject()};
$('sndBtn').onclick=()=>{const on=Sound.toggle();$('sndBtn').textContent=on?'🔊':'🔇'};

function openLenPick(){show('lenPick');$('homeBtn').classList.remove('hidden');$('progress').classList.add('hidden')}
function openSubject(){show(app.subject==='math'?'mathMenu':'engMenu');$('homeBtn').classList.remove('hidden');$('progress').classList.add('hidden')}
// tombol rumah: dari materi/soal/skor → kembali ke menu pelajaran; dari menu pelajaran → pemilih pelajaran
function goHome(){
  const cur=document.querySelector('.screen.active').id;
  Sound.stopMusic();
  if(cur==='mathMenu'||cur==='engMenu'||cur==='home'){show('home');$('homeBtn').classList.add('hidden')}
  else{openSubject()}
  $('progress').classList.add('hidden');
}

function startSession(){
  app.idx=0;app.score=0;app.wrong=0;
  if(Sound.isOn())Sound.startMusic();
  show('play');$('homeBtn').classList.remove('hidden');$('progress').classList.remove('hidden');
  nextQuestion();
}

/* ============ FEEDBACK / STARS ============ */
function addStar(){app.stars++;$('starCount').textContent=app.stars}
function onCorrect(){
  app.score++;addStar();Sound.correct();confetti();
  showFeedback(pick(['🎉','🌟','🥳','👏']),pick(['Great!','Yay!','Correct!','Well done!']));
  setTimeout(advance,1250);
}
function onWrong(){
  app.wrong++;Sound.wrong();
  showFeedback('❌',pick(['Wrong','Not quite','Oops!']));
  setTimeout(advance,1250);   // salah = tetap lanjut ke soal berikutnya
}
function advance(){
  app.idx++;
  if(app.idx>=app.total)endSession();
  else nextQuestion();
}
function showFeedback(face,word){
  $('fbFace').textContent=face;$('fbWord').textContent=word;
  const f=$('feedback');f.classList.add('show');
  setTimeout(()=>f.classList.remove('show'),1100);
}
function updateProgress(){$('progress').textContent=`${app.idx+1}/${app.total}`}

/* ============ SCORE SCREEN ============ */
function endSession(){
  Sound.stopMusic();Sound.fanfare();
  const right=app.score, wrong=app.wrong, m=app.total;
  const nilai=Math.round(right/m*100);   // nilai 0–100
  let stars,face,title;
  if(nilai>=90){stars=3;face='🏆';title='Amazing!'}
  else if(nilai>=60){stars=2;face='🎉';title='Well done!'}
  else{stars=1;face='😊';title='Keep going!'}
  $('scoreFace').textContent=face;$('scoreTitle').textContent=title;
  $('scoreNum').textContent=nilai;
  $('tallyRight').textContent=right;
  $('tallyWrong').textContent=wrong;
  $('scoreStars').textContent='⭐'.repeat(stars)+'☆'.repeat(3-stars);
  show('scoreScreen');$('progress').classList.add('hidden');
  bigConfetti();
}

/* ============ QUESTION ROUTER ============ */
function nextQuestion(){
  updateProgress();
  const m=app.mode;
  if(m==='add')qAddSub('+');
  else if(m==='sub')qAddSub('-');
  else if(m==='mul')qMulDiv('×');
  else if(m==='div')qMulDiv('÷');
  else if(m==='ls')qLargerSmaller();
  else if(m==='fm')qFewerMore();
  else if(m==='est')qEstremes();
  else if(m==='btw')qBetween();
  else if(m==='en_name')qEnAnswer('name');
  else if(m==='en_age')qEnAnswer('age');
  else if(m==='en_toy')qEnAnswer('toy');
  else if(m==='en_pron')qEnPronoun();
  else if(m==='en_ask')qEnAsk();
  else if(m==='en_mix'){
    const r=pick(['name','age','toy','pron','ask','pron','ask']);
    if(r==='pron')qEnPronoun();else if(r==='ask')qEnAsk();else qEnAnswer(r);
  }
}
function groupHTML(n,emo){let s='<div class="emoji-group">';for(let i=0;i<n;i++)s+=`<span>${emo}</span>`;return s+'</div>'}

function qAddSub(op){
  let a,b,ans;
  if(op==='+'){a=rnd(1,9);b=rnd(1,9);ans=a+b}else{a=rnd(2,10);b=rnd(1,a);ans=a-b}
  const emo=pick(EMO);
  $('qhead').innerHTML=(op==='+'?'How many in total?':'How many are left?');
  $('qbody').innerHTML=`
    <div class="prompt-card"><span class="bignum">${a}</span><span class="op">${op}</span><span class="bignum">${b}</span><span class="op">=</span><span class="bignum">?</span></div>
    <div class="prompt-card" style="min-height:0;padding:16px 22px">${groupHTML(a,emo)}<span class="op">${op}</span>${groupHTML(b,emo)}</div>
    <div class="options" id="opts"></div>`;
  buildOptions(ans,4,String);
}
function qLargerSmaller(){
  let a=rnd(1,20),b=rnd(1,20);while(b===a)b=rnd(1,20);
  const wantLarger=Math.random()>.5;
  $('qhead').innerHTML=`Tap the ${wantLarger?'LARGER':'SMALLER'} number`;
  const target=wantLarger?Math.max(a,b):Math.min(a,b);
  compareCards([a,b],v=>v===target);
}
function qFewerMore(){
  const emo=pick(EMO);let a=rnd(1,9),b=rnd(1,9);while(b===a)b=rnd(1,9);
  const wantMore=Math.random()>.5;
  $('qhead').innerHTML=`Tap the group with ${wantMore?'MORE':'FEWER'}`;
  const target=wantMore?Math.max(a,b):Math.min(a,b);
  $('qbody').innerHTML=`<div class="compare-wrap" id="cw"></div>`;
  [a,b].forEach(n=>{
    const box=document.createElement('div');box.className='compare-box';box.innerHTML=groupHTML(n,emo);
    box.onclick=()=>{if(n===target){box.classList.add('pick-ok');lock();onCorrect()}else{box.classList.add('pick-no');lock();onWrong()}};
    $('cw').appendChild(box);
  });
}
function qEstremes(){
  const nums=[];while(nums.length<4){const n=rnd(1,30);if(!nums.includes(n))nums.push(n)}
  const wantLargest=Math.random()>.5;
  $('qhead').innerHTML=`Tap the ${wantLargest?'LARGEST':'SMALLEST'} number`;
  const target=wantLargest?Math.max(...nums):Math.min(...nums);
  compareCards(nums,v=>v===target);
}
function qBetween(){
  const type=pick(['all','all','middle']); // sedikit lebih sering "all"

  if(type==='middle'){
    // jarak genap → ada tengah pasti. contoh 12 … 16 → 14
    const gap=pick([2,4]);              // 2→satu tengah, 4→satu tengah
    const a=rnd(1,20-gap),c=a+gap,ans=a+gap/2;
    $('qhead').innerHTML=`Which number is in the MIDDLE of ${a} and ${c}?`;
    $('qbody').innerHTML=`
      <div class="prompt-card"><span class="bignum">${a}</span><span class="op">…</span><span class="bignum" style="color:var(--coral)">?</span><span class="op">…</span><span class="bignum">${c}</span></div>
      <div class="options" id="opts"></div>`;
    buildOptions(ans,4,String,()=>{const set=new Set([ans]);while(set.size<4){const d=ans+pick([-3,-2,-1,1,2,3]);if(d>0&&d!==ans)set.add(d)}return[...set]});
    return;
  }

  // type 'all' → pilih SEMUA angka di antara. contoh 11 … 15 → 12,13,14
  const gap=rnd(3,5);                    // menghasilkan 2–4 jawaban benar
  const a=rnd(1,20-gap),c=a+gap;
  const answers=[];for(let x=a+1;x<c;x++)answers.push(x);
  $('qhead').innerHTML=`Tap ALL the numbers between ${a} and ${c}`;

  // opsi = semua jawaban benar + beberapa distraktor (di luar range)
  const opts=new Set(answers);
  const outside=[a,c,a-1,c+1,a-2,c+2].filter(v=>v>0&&(v<=a||v>=c));
  while(opts.size<Math.min(answers.length+3,6) && outside.length){opts.add(pick(outside))}
  while(opts.size<answers.length+2){const o=rnd(1,25);if(o<=a||o>=c)opts.add(o)}
  const vals=[...opts].sort((x,y)=>x-y); // urut biar mudah dibaca anak
  const correctSet=new Set(answers);
  const picked=new Set();

  $('qbody').innerHTML=`
    <div class="prompt-card"><span class="bignum">${a}</span><span class="op">…</span><span class="bignum" style="color:var(--coral)">?</span><span class="op">…</span><span class="bignum">${c}</span></div>
    <div class="options" id="opts"></div>
    <button class="check-btn" id="checkBtn" disabled>✅ Check answer</button>`;

  const box=$('opts');
  if(vals.length>4)box.classList.add('three');else box.classList.remove('three');
  vals.forEach(v=>{
    const b=document.createElement('button');b.className='opt';b.textContent=v;b.dataset.v=v;
    b.onclick=()=>{
      Sound.tap();
      if(picked.has(v)){picked.delete(v);b.classList.remove('sel')}
      else{picked.add(v);b.classList.add('sel')}
      $('checkBtn').disabled=picked.size===0;
    };
    box.appendChild(b);
  });

  $('checkBtn').onclick=()=>{
    // benar jika himpunan pilihan == himpunan jawaban (tidak kurang, tidak lebih)
    const right = picked.size===correctSet.size && [...picked].every(v=>correctSet.has(v));
    $('checkBtn').disabled=true;
    box.querySelectorAll('.opt').forEach(b=>b.style.pointerEvents='none');
    if(right){
      box.querySelectorAll('.opt').forEach(b=>{if(correctSet.has(+b.dataset.v))b.classList.add('ok')});
      onCorrect();
    }else{
      // tandai pilihan anak yang salah (merah), jangan bocorkan yang benar, lalu lanjut
      box.querySelectorAll('.opt').forEach(b=>{if(picked.has(+b.dataset.v))b.classList.add('no')});
      onWrong();
    }
  };
}

function qMulDiv(op){
  let a,b,ans;
  if(op==='×'){
    // level kelas 1: faktor kecil 1-5 (hasil max 25)
    a=rnd(1,5);b=rnd(1,5);ans=a*b;
  }else{
    // pembagian tanpa sisa: bikin dari perkalian dulu
    b=rnd(1,5);ans=rnd(1,5);a=b*ans; // a ÷ b = ans
  }
  const emo=pick(EMO);
  $('qhead').innerHTML=(op==='×'?'How many in total?':'How many in each group?');
  // visual: perkalian = b baris x a; pembagian = a benda dibagi b grup
  let visual='';
  if(op==='×'){
    visual='<div class="prompt-card" style="min-height:0;padding:14px 18px;flex-direction:column;gap:6px">';
    for(let r=0;r<b;r++)visual+=groupHTML(a,emo);
    visual+='</div>';
  }else{
    visual=`<div class="prompt-card" style="min-height:0;padding:14px 18px">${groupHTML(a,emo)}</div>`;
  }
  $('qbody').innerHTML=`
    <div class="prompt-card"><span class="bignum">${a}</span><span class="op">${op}</span><span class="bignum">${b}</span><span class="op">=</span><span class="bignum">?</span></div>
    ${visual}
    <div class="options" id="opts"></div>`;
  buildOptions(ans,4,String);
}


/* ============ BAHASA INGGRIS: He/She · His/Her ============ */
const EN={
  boys:['William','Adam','Kevin','Daniel','Rafi','Bima','Alex','Leo','Noah','Arka'],
  girls:['Sarah','Emma','Mia','Nadia','Salsa','Lily','Aisha','Zoe','Kayla','Naura'],
  toys:[['scooter','🛴'],['ball','⚽'],['robot','🤖'],['doll','🪆'],['car','🚗'],['kite','🪁'],['teddy bear','🧸'],['bicycle','🚲'],['puzzle','🧩'],['train','🚂'],['drum','🥁'],['blocks','🧱']],
  boyAv:['👦','🧒','👦🏽','👦🏻'], girlAv:['👧','👧🏽','👧🏻','🧒']
};
function genChar(){
  const male=Math.random()>.5;
  return {
    male, name: pick(male?EN.boys:EN.girls),
    age: rnd(5,20), toy: pick(EN.toys),
    av: pick(male?EN.boyAv:EN.girlAv),
    he: male?'He':'She', his: male?'His':'Her',
    heL: male?'he':'she', hisL: male?'his':'her'
  };
}
function otherName(c){return pick((c.male?EN.boys:EN.girls).filter(n=>n!==c.name))}
function otherAge(c){let a;do{a=rnd(5,20)}while(a===c.age);return a}
function otherToy(c){return pick(EN.toys.filter(t=>t[0]!==c.toy[0]))}
function charCard(c,hide){
  // hide: kunci info yang tidak ditampilkan (misal 'name' saat sedang ditanya... tetap tampil agar anak bisa membaca)
  return `<div class="char-card">
    <div class="avatar">${c.av}</div>
    <div class="info">
      <div class="row"><span class="k">Name</span><b>${c.name}</b></div>
      <div class="row"><span class="k">Age</span><b>${c.age}</b></div>
      <div class="row"><span class="k">Toy</span><b>${c.toy[1]} ${c.toy[0]}</b></div>
    </div></div>`;
}
function sentenceOptions(correct,distractors){
  // render 4 opsi kalimat; benar/salah langsung dinilai
  const vals=[correct,...distractors].sort(()=>Math.random()-.5);
  const box=$('opts');box.innerHTML='';box.classList.remove('three');box.classList.add('sent');
  vals.forEach(v=>{
    const b=document.createElement('button');b.className='opt sent';b.textContent=v;
    b.onclick=()=>{if(v===correct){b.classList.add('ok');lock();onCorrect()}else{b.classList.add('no');lock();onWrong()}};
    box.appendChild(b);
  });
}
const aAn=w=>(/^[aeiou]/i.test(w)?'an ':'a ')+w;

// Tipe 1-3: baca kartu, jawab pertanyaan (name / age / toy)
function qEnAnswer(kind){
  const c=genChar(), c2={...c, he:c.male?'She':'He', his:c.male?'Her':'His'}; // versi pronoun terbalik
  let q,ans,d;
  if(kind==='name'){
    q=`What is ${c.hisL} name?`;
    ans=`${c.his} name is ${c.name}.`;
    const on=otherName(c);
    d=[`${c2.his} name is ${c.name}.`, `${c.his} name is ${on}.`, `${c.he} is ${c.age}.`];
  }else if(kind==='age'){
    q=`How old is ${c.heL}?`;
    ans=`${c.he} is ${c.age}.`;
    const oa=otherAge(c);
    d=[`${c2.he} is ${c.age}.`, `${c.he} is ${oa}.`, `${c.his} name is ${c.name}.`];
  }else{
    q=`What is ${c.hisL} favorite toy?`;
    ans=`${c.his} favorite toy is ${aAn(c.toy[0])}.`;
    const ot=otherToy(c);
    d=[`${c2.his} favorite toy is ${aAn(c.toy[0])}.`, `${c.his} favorite toy is ${aAn(ot[0])}.`, `${c.he} is ${c.age}.`];
  }
  $('qhead').innerHTML='Read the card and choose the correct answer';
  $('qbody').innerHTML=charCard(c)+`<div class="q-sentence">${q}</div><div class="options" id="opts"></div>`;
  sentenceOptions(ans,d);
}

// Tipe 4: isi yang kosong dengan He / She / His / Her
function qEnPronoun(){
  const c=genChar();
  const v=pick(['name','age','toy','isBoy']);
  let sentence,ans;
  if(v==='name'){sentence=`<span class="blank">?</span> name is ${c.name}.`;ans=c.his}
  else if(v==='age'){sentence=`<span class="blank">?</span> is ${c.age} years old.`;ans=c.he}
  else if(v==='toy'){sentence=`<span class="blank">?</span> favorite toy is ${aAn(c.toy[0])}.`;ans=c.his}
  else{sentence=`${c.name} is a ${c.male?'boy':'girl'}. <span class="blank">?</span> is ${c.age}.`;ans=c.he}
  $('qhead').innerHTML='Fill in the blank';
  $('qbody').innerHTML=charCard(c)+`<div class="q-sentence">${sentence}</div><div class="options" id="opts"></div>`;
  const vals=['He','She','His','Her'].sort(()=>Math.random()-.5);
  const box=$('opts');box.innerHTML='';box.classList.remove('three','sent');
  vals.forEach(w=>{
    const b=document.createElement('button');b.className='opt word';b.textContent=w;
    b.onclick=()=>{if(w===ans){b.classList.add('ok');lock();onCorrect()}else{b.classList.add('no');lock();onWrong()}};
    box.appendChild(b);
  });
}

// Tipe 5: diberi jawaban, pilih pertanyaannya
function qEnAsk(){
  const c=genChar();
  const kind=pick(['name','age','toy']);
  let ansSent,q;
  if(kind==='name'){ansSent=`${c.his} name is ${c.name}.`;q=`What is ${c.hisL} name?`}
  else if(kind==='age'){ansSent=`${c.he} is ${c.age}.`;q=`How old is ${c.heL}?`}
  else{ansSent=`${c.his} favorite toy is ${aAn(c.toy[0])}.`;q=`What is ${c.hisL} favorite toy?`}
  const oh=c.male?'her':'his', ohe=c.male?'she':'he';
  const pool={
    name:[`What is ${oh} name?`,`How old is ${c.heL}?`,`What is ${c.hisL} favorite toy?`],
    age:[`How old is ${ohe}?`,`What is ${c.hisL} name?`,`What is ${c.hisL} favorite toy?`],
    toy:[`What is ${oh} favorite toy?`,`What is ${c.hisL} name?`,`How old is ${c.heL}?`]
  }[kind];
  $('qhead').innerHTML='Which question matches the answer?';
  $('qbody').innerHTML=charCard(c)+`<div class="q-sentence">💬 ${ansSent}</div><div class="options" id="opts"></div>`;
  sentenceOptions(q,pool);
}

function buildOptions(ans,count,fmt,distractorFn){
  let vals;
  if(distractorFn)vals=distractorFn();
  else{const set=new Set([ans]);while(set.size<count){let d=ans+rnd(-4,4);if(d<0)d=Math.abs(d)+1;set.add(d)}vals=[...set]}
  vals.sort(()=>Math.random()-.5);
  const box=$('opts');box.innerHTML='';box.classList.remove('sent');
  vals.length===3?box.classList.add('three'):box.classList.remove('three');
  vals.forEach(v=>{
    const b=document.createElement('button');b.className='opt';b.textContent=fmt(v);
    b.onclick=()=>{if(v===ans){b.classList.add('ok');lock();onCorrect()}else{b.classList.add('no');lock();onWrong()}};
    box.appendChild(b);
  });
}
function compareCards(nums,isRight){
  $('qbody').innerHTML=`<div class="compare-wrap" id="cw"></div>`;
  const wrap=$('cw');if(nums.length>2)wrap.style.maxWidth='820px';
  nums.forEach(n=>{
    const box=document.createElement('div');box.className='compare-box';box.style.minWidth=nums.length>2?'150px':'200px';
    box.innerHTML=`<div class="cnt">${n}</div>`;
    box.onclick=()=>{if(isRight(n)){box.classList.add('pick-ok');lock();onCorrect()}else{box.classList.add('pick-no');lock();onWrong()}};
    wrap.appendChild(box);
  });
}
function lock(){document.querySelectorAll('.opt,.compare-box').forEach(e=>e.style.pointerEvents='none');setTimeout(()=>document.querySelectorAll('.opt,.compare-box').forEach(e=>e.style.pointerEvents=''),1250)}

/* ============ CONFETTI ============ */
function confetti(count=26){
  const cols=['#ff8c69','#ffd23f','#8ed081','#a882dd','#7ec8e3','#e07a9b'];
  for(let i=0;i<count;i++){
    const c=document.createElement('div');c.className='confetti';
    c.style.left=Math.random()*100+'vw';c.style.background=pick(cols);
    c.style.borderRadius=Math.random()>.5?'50%':'2px';
    document.body.appendChild(c);
    const dur=900+Math.random()*900;
    c.animate([{transform:'translateY(0) rotate(0)',opacity:1},{transform:`translateY(105vh) rotate(${rnd(180,720)}deg)`,opacity:.9}],{duration:dur,easing:'ease-in'});
    setTimeout(()=>c.remove(),dur);
  }
}
function bigConfetti(){confetti(60);setTimeout(()=>confetti(40),500);setTimeout(()=>confetti(40),1000)}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
